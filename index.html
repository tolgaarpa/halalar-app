<html lang="tr">
<head>
<meta charset="utf-8"><script>/* Hit Pazarı tek proje: uygulama yalnız kart destesidir. Ürünle (#u=) gelinmediyse Hit Pazarı ana sayfasına gider; eski yalnız-Halalar tüneli açılmaz. */(()=>{if(/^#u=/.test(location.hash)||/[?&](pazar=1|t=)/.test(location.search))return;const y={'8769':'8766','8771':'8770'}[location.port];location.replace((y?location.protocol+'//'+location.hostname+':'+y+'/':'https://tolgaarpa.github.io/hitpazari/')+'hit.html')})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Halalar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--ink:#f2efe9;--muted:#8a867f;--line:#25252a;--card:#16161a;
  --like:#e8201c;--nope:#cfcac1;--offer:#4c66ff;--buy:#ffd21f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;overflow:hidden;overscroll-behavior-y:none;overscroll-behavior-x:auto;touch-action:none}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.logo{font-family:Anton,sans-serif;text-transform:uppercase;font-size:26px;letter-spacing:-.02em}
.sayac{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
/* kart yığını */
#deste{position:relative;flex:1;margin:6px 14px 0}
.kart{position:absolute;inset:0;border-radius:3px;background:var(--card);overflow:hidden;touch-action:none;user-select:none;will-change:transform;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.kart .gorsel{position:absolute;inset:0 0 146px 0;display:block;padding:26px;background:radial-gradient(ellipse at 50% 40%,#232329 0%,#141417 70%)}
.kart img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 22px 26px rgba(0,0,0,.6));pointer-events:none}
.kart .bilgi{position:absolute;left:0;right:0;bottom:0;min-height:146px;padding:12px 20px 14px;background:#111114;border-top:1px solid var(--line)}
.kart .donem{flex:1;min-width:0;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kart h2{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;font-size:24px;letter-spacing:-.02em;line-height:1.05;margin:4px 0 5px}
.kart .alt{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.kart p{font-size:13px;color:#b9b5ad;line-height:1.38;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.kart .ust1{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kart .fiyat{flex:none;font-family:Anton,sans-serif;text-transform:uppercase;font-size:22px;white-space:nowrap}
.kart .fiyat small{font-family:Barlow;font-size:9px;letter-spacing:.2em;color:var(--muted);margin-left:4px}
/* yön damgaları */
.damga{position:absolute;font-weight:600;font-size:22px;letter-spacing:.14em;padding:6px 12px;border:3px solid;border-radius:3px;opacity:0;pointer-events:none;text-transform:uppercase}
.d-like{top:28px;left:22px;color:var(--like);transform:rotate(-12deg)}
.d-nope{top:28px;right:22px;color:var(--nope);transform:rotate(12deg)}
.d-offer{bottom:140px;left:50%;transform:translateX(-50%);color:var(--offer)}
.d-buy{top:26px;left:50%;transform:translateX(-50%);color:var(--buy)}
.bos{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.bos b{display:block;font-family:Anton,sans-serif;text-transform:uppercase;font-weight:300;font-size:28px;color:var(--ink);margin-bottom:8px}
/* yön ipucu */
.ipucu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px 6px}
.ipucu button{background:#141417;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:9px 4px 8px;font:500 10px/1.2 Barlow;letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:5px}
.ipucu svg{width:20px;height:20px}
.ipucu .b-nope{color:var(--nope)}.ipucu .b-offer{color:var(--offer)}.ipucu .b-buy{color:var(--buy)}.ipucu .b-like{color:var(--like)}
/* alt menü */
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:6px}
nav button{background:none;border:0;color:var(--muted);padding:12px 0 14px;font:500 11px/1 Barlow;letter-spacing:.18em;text-transform:uppercase;position:relative}
nav button.on{color:var(--ink)}
nav .rozet{position:absolute;top:6px;margin-left:4px;background:var(--ink);color:var(--bg);border-radius:3px;font-size:9px;padding:2px 6px;letter-spacing:0}
/* listeler */
.sayfa{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:50}
.sayfa.on{display:flex}
.sayfa header{border-bottom:1px solid var(--line)}
.liste{flex:1;overflow:auto;padding:10px 14px 90px;touch-action:pan-y}
.satir{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.satir img{width:72px;height:72px;object-fit:contain;background:#141417;border-radius:3px;padding:6px}
.satir h3{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;font-size:17px;line-height:1.1}
.satir .k{font-size:11px;color:var(--muted);margin-top:4px}
.satir .t{font-family:Anton,sans-serif;text-transform:uppercase;font-size:17px;text-align:right}
.satir .durum{font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-top:4px;text-align:right}
.liste .yok{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px}
.geri{background:none;border:0;color:var(--ink);font:500 11px Barlow;letter-spacing:.2em;text-transform:uppercase}
/* alt sayfa (teklif / satın al) */
#perde{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:60}
#perde.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#121215;border-top:1px solid var(--line);border-radius:6px 6px 0 0;padding:16px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:61;touch-action:auto}
#sheet.on{transform:none}
#sheet .tut{width:40px;height:4px;border-radius:3px;background:#333;margin:0 auto 14px}
#sheet .ust{display:flex;gap:14px;align-items:center}
#sheet .ust img{width:64px;height:64px;object-fit:contain;background:#1a1a1e;border-radius:3px;padding:6px}
#sheet .bas{font-size:10px;letter-spacing:.28em;text-transform:uppercase}
#sheet h3{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;font-size:21px;line-height:1.1;margin-top:3px}
#sheet .liste-fiyat{color:var(--muted);font-size:13px;margin-top:3px}
.teklif-kutu{margin:18px 0 6px;display:flex;align-items:center;gap:10px;background:#0d0d10;border:1px solid var(--line);border-radius:3px;padding:6px 6px 6px 16px}
.teklif-kutu input{flex:1;background:none;border:0;color:var(--ink);font:400 30px Anton,sans-serif;width:100%;outline:none}
.teklif-kutu span{color:var(--muted);font-size:14px;padding-right:8px}
.hizli{display:flex;gap:8px;margin:10px 0 4px}
.hizli button{flex:1;background:#1a1a1e;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:9px 0;font:500 12px Barlow}
.ozet{margin:16px 0 4px;font-size:14px;color:#c9c5bd;line-height:1.6}
.ozet div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
.btns{display:flex;gap:10px;margin-top:18px}
.btns button{flex:1;border-radius:3px;padding:15px 0;font:600 13px Barlow;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);background:#1a1a1e;color:var(--ink)}
.btns .ana{border:0;color:#111}
.not{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.4}
#toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-20px);background:var(--ink);color:#111;padding:10px 16px;border-radius:3px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:70;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* tünel girişi */
#tunel{position:absolute;inset:0;z-index:40;background:var(--bg);touch-action:none}
#tunel canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#tunel .tust{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px 10px;pointer-events:none;background:linear-gradient(#0b0b0dcc,#0b0b0d00)}
#tunel .tust .logo{text-shadow:0 1px 8px #000}
#tunel .tust .hit{display:inline-block;pointer-events:auto;font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#ff5a1f;text-decoration:none;text-shadow:0 1px 8px #000;padding:6px 0 2px}
#tunel .derin{font-size:11px;letter-spacing:.22em;color:var(--muted)}
#tunel .talt{position:absolute;left:0;right:0;bottom:0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(#0b0b0d00,#0b0b0dee 45%)}
#tunel .talt p{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
#tunel .talt button{background:var(--ink);color:#111;border:0;border-radius:3px;padding:13px 26px;font:600 12px Barlow;letter-spacing:.18em;text-transform:uppercase}
#secim{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:var(--ink);color:#111;border-radius:3px;padding:9px 16px;font-size:13px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:2}
#secim.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tunele{background:none;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:6px 12px;font:500 10px Barlow;letter-spacing:.2em;text-transform:uppercase}
.kisi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kisi input{background:#0d0d10;border:1px solid var(--line);border-radius:3px;color:var(--ink);padding:12px;font:400 14px Barlow;outline:none;min-width:0}
.kisi input:focus{border-color:var(--muted)}
.hata{color:var(--nope);font-size:12px;margin-top:8px;min-height:14px}
.yanit{font-size:11px;color:var(--ink);margin-top:3px;text-align:right}
.rza{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:11.5px;line-height:1.4;color:var(--muted)}
.rza input{margin-top:2px;width:16px;height:16px;flex:none;accent-color:#f2efe9}
.rza a{color:var(--ink)}
.noktalar{position:absolute;left:0;right:0;bottom:130px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.noktalar i{width:6px;height:6px;border-radius:50%;background:#ffffff40}.noktalar i.on{background:var(--ink)}
.acilar{position:absolute;top:12px;right:14px;font-size:10px;letter-spacing:.18em;color:var(--muted);pointer-events:none}
#ara{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#ara.on{display:flex}
#ara .ust2{display:flex;gap:10px;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
#ara input{flex:1;min-width:0;background:#17171b;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:11px 16px;font:400 15px Barlow;outline:none}
#ara .katlar{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
#ara .katlar button{flex:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:3px;padding:7px 13px;font:500 12px Barlow;white-space:nowrap}
#ara .katlar button.on{background:var(--ink);color:#111;border-color:var(--ink)}
#ara .sonuc{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 16px calc(20px + env(safe-area-inset-bottom));align-content:start}
#ara .oge{background:#141417;border:1px solid var(--line);border-radius:3px;padding:10px;text-align:left;color:var(--ink);font:inherit}
#ara .oge img{width:100%;aspect-ratio:1;object-fit:contain;display:block;margin-bottom:8px}
#ara .oge b{display:block;font-weight:500;font-size:13px;line-height:1.25}
#ara .oge small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
#ara .yok{grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 0}

/* Hit Pazarı logosu: kırmızı çift eğik çizgi + HİT PAZARI (her sayfanın sol üstünde) */
html{font-synthesis:none}
.hpi-sol{display:flex;align-items:center;gap:12px;min-width:0}
.hp-logo{display:inline-flex;align-items:center;gap:.36em;flex:none;text-decoration:none;pointer-events:auto;color:#f2efe9;font:400 22px/1 Anton,"Arial Narrow",Impact,sans-serif;letter-spacing:.005em;white-space:nowrap;text-shadow:none}
.hp-logo .hp-c{color:#e8201c;font-size:1.1em;letter-spacing:-.04em;transform:skewX(-14deg)}
/* vintage dili: Anton başlık, Barlow gövde, kırmızı/kobalt vurgu */
.logo{font-size:22px;line-height:1;letter-spacing:.01em;white-space:nowrap}
header .hp-logo,.tust .hp-logo{font-size:19px}
header{gap:8px}
.sayac,.geri,.tunele,#tunel .derin{font-family:"Barlow Condensed",sans-serif;font-weight:700}
.tunele{border-color:#55555e;font-size:12px;padding:7px 11px}
.kart h2{font-size:25px;letter-spacing:.005em;line-height:1.1}
.kart .fiyat{font-size:23px}
.kart .donem{font:700 11px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.1em}
.damga{font-family:Anton,sans-serif;font-weight:400;border-width:3px}
.ipucu button{font:700 12px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.14em}
nav button{font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.18em}
nav button.on{box-shadow:inset 0 2px 0 var(--like)}
nav .rozet{background:var(--like);color:#fff;font-family:Barlow,sans-serif}
.satir h3{font-size:18px;line-height:1.15}
#sheet h3{font-size:23px;line-height:1.12}
.btns button{font:400 16px/1 Anton,sans-serif;letter-spacing:.06em}
.btns .ana{color:#fff}
.btns .ana[style*="--buy"]{color:#111}
#tunel .talt button{background:var(--offer);background:#1b2fa0;color:#fff;font:400 17px/1 Anton,sans-serif;letter-spacing:.06em;padding:14px 26px 13px;transform:skewX(-8deg)}
#tunel .talt p{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px}
.bos b{font-size:30px;line-height:1.1}
#ara .katlar button{font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:400px){header .hp-a{display:none}header .hp-logo{font-size:24px}}

/* deste başlığı: Hit Pazarı logosu büyük, Halalar kırmızı */
header .hp-logo{font-size:30px}
header .hp-a{display:inline!important}
header .logo{font:400 30px/1 Anton,"Arial Narrow",Impact,sans-serif;letter-spacing:.005em;text-transform:uppercase;color:#e8201c;border-left:0;padding-left:4px}
@media(max-width:600px){header .hpi-sol{flex-direction:column;align-items:flex-start;gap:2px}header .hp-logo{font-size:22px}header .logo{font-size:28px;padding-left:0}}
/* tünel başlığı: Hit Pazarı 2 kat, dükkân adı alt satırda 3 kat */
.tust .hpi-sol{flex-direction:column;align-items:flex-start;gap:2px}
.tust .hp-logo{font-size:55px}
.tust .logo{font:400 28px/1.05 Anton,"Arial Narrow",Impact,sans-serif;letter-spacing:0;text-transform:uppercase;color:#e8201c;border-left:0;padding-left:0}
/* ara: dükkân içi gibi beyaz, çerçevesiz, dekupe */
#ara{background:#fff;color:#111114}
#ara input{background:#fff;border:0;border-bottom:2px solid #111114;border-radius:0;color:#111114;font:500 18px Barlow;padding:10px 2px}
#ara input::placeholder{color:#8a8a92}
#ara .tunele{color:#111114;border-color:#c9c9d0;background:#fff}
#ara .katlar button{border-color:#c9c9d0;color:#111114;background:#fff}
#ara .katlar button.on{background:#e8201c;border-color:#e8201c;color:#fff}
#ara .sonuc{gap:24px 14px}
#ara .oge{background:none;border:0;border-radius:0;padding:0;color:#111114;text-align:center}
#ara .oge img{padding:8%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.14))}
#ara .oge small{color:#77777f}
#ara .yok{color:#77777f}
#ara .ara-bas{display:flex;align-items:baseline;gap:14px;padding:calc(14px + env(safe-area-inset-top)) 16px 0;max-width:1200px;width:100%;margin:0 auto}
#ara .ara-bas .hp-logo{color:#111114;text-shadow:none;font-size:30px;display:inline-flex!important}
#ara .ara-bas .hp-a{display:inline!important}
#ara .ara-bas b{font:400 30px/1 Anton,Impact,sans-serif;text-transform:uppercase;color:#e8201c}
#ara .ust2{padding-top:10px}

#ara .katlar{flex-wrap:wrap;align-items:center}
#ara .katlar button.b1{font-size:22px;padding:11px 16px}
#ara .katlar button.b2{font-size:16px;padding:9px 13px}
#ara .katlar button.b3{font-size:12px;padding:7px 11px}

/* yönler ürün fotoğrafının dört kenarında, kartın üstünde (kart küçülmez): üst Teklif ver, alt Satın al, sol Geç, sağ Beğen */
.ipucu{position:absolute;display:block;padding:0;pointer-events:none;z-index:20}
.ipucu button{position:absolute;pointer-events:auto;background:none!important;border:0!important;padding:4px 6px;display:flex;align-items:center;gap:6px;font:700 12px/1 "Barlow Condensed",sans-serif!important;letter-spacing:.24em!important;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 6px #000,0 0 2px #000;opacity:.92}
.ipucu svg{width:14px;height:14px;flex:none;filter:drop-shadow(0 1px 3px #000)}
.ipucu .b-offer{top:8px;left:50%;transform:translateX(-50%)}
.ipucu .b-buy{bottom:8px;left:50%;transform:translateX(-50%)}
.ipucu .b-nope,.ipucu .b-like{top:50%;width:26px;padding:6px 0;flex-direction:column;justify-content:center;writing-mode:vertical-rl}
.ipucu .b-nope{left:6px;transform:translateY(-50%) rotate(180deg)}
.ipucu .b-like{right:6px;transform:translateY(-50%)}
.ipucu .b-nope svg,.ipucu .b-like svg{transform:rotate(90deg)}

#ara .sonuc{display:grid;grid-template-columns:repeat(60,minmax(0,1fr));gap:22px 0}
#ara .oge{padding:0 4px!important;min-width:0}
#ara .oge.s4{grid-column:span 15}#ara .oge.s5{grid-column:span 12}#ara .oge.s6{grid-column:span 10}
#ara .oge b{font-size:13px;line-height:1.2}#ara .oge.s5 b{font-size:11.5px}#ara .oge.s6 b{font-size:10.5px}
#ara .oge small{font-size:10px}#ara .oge.s6 small{display:none}
#ara .oge img{padding:4%}

/* BİLGİSAYAR: deste telefon sütunu değil, geniş ekran düzeni (fotoğraf solda büyük, bilgi sağda); telefon görünümü aynı kalır */
@media(min-width:900px){
#app{max-width:1280px;padding-left:32px;padding-right:32px}
header{padding:20px 0 12px}
#deste{margin:6px 0 0}
.kart .gorsel{inset:0 38% 0 0;padding:56px 70px}
.kart .bilgi{left:62%;top:0;bottom:0;min-height:0;border-top:0;border-left:1px solid var(--line);padding:56px 48px;display:flex;flex-direction:column;justify-content:center}
.kart .ust1{flex-direction:column;align-items:flex-start;gap:14px}
.kart .donem{font-size:14px!important;letter-spacing:.16em;white-space:normal}
.kart .fiyat{font-size:46px}
.kart .fiyat small{font-size:11px}
.kart h2{font-size:clamp(34px,3.2vw,54px);line-height:1.04;margin:22px 0 16px}
.kart p{font-size:17px;line-height:1.5;-webkit-line-clamp:9}
.noktalar{bottom:22px;right:38%}
.acilar{right:calc(38% + 16px);top:16px;font-size:12px}
.damga{font-size:34px;padding:8px 16px}
.ipucu button{font-size:15px!important}
.ipucu .b-offer{top:14px}.ipucu .b-buy{bottom:14px}.ipucu .b-nope{left:12px}.ipucu .b-like{right:12px}

function surukle(el,id){
  let x0=0,y0=0,dx=0,dy=0,basildi=false;
  const st={like:el.querySelector('.d-like'),nope:el.querySelector('.d-nope'),offer:el.querySelector('.d-offer'),buy:el.querySelector('.d-buy')};
  const goster=()=>{
    const ax=Math.abs(dx),ay=Math.abs(dy);
    st.like.style.opacity=dx>0&&ax>ay?Math.min(1,ax/100):0;
    st.nope.style.opacity=dx<0&&ax>ay?Math.min(1,ax/100):0;
    st.offer.style.opacity=dy<0&&ay>ax?Math.min(1,ay/110):0;
    st.buy.style.opacity=dy>0&&ay>ax?Math.min(1,ay/110):0;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx*0.06}deg)`};
  el.addEventListener('pointerdown',e=>{basildi=true;x0=e.clientX;y0=e.clientY;el.setPointerCapture(e.pointerId);el.style.transition='none'});
  el.addEventListener('pointermove',e=>{if(!basildi)return;dx=e.clientX-x0;dy=e.clientY-y0;goster()});
  const birak=()=>{if(!basildi)return;basildi=false;
    const ax=Math.abs(dx),ay=Math.abs(dy);let yon=null;
    if(ax>ay&&ax>100)yon=dx>0?'sag':'sol'; else if(ay>ax&&ay>110)yon=dy<0?'yukari':'asagi';
    if(!yon&&ax<8&&ay<8)aciDegis(el,id);
    if(yon)karar(el,id,yon); else {el.style.transition='transform .3s cubic-bezier(.2,.8,.2,1)';dx=dy=0;goster();Object.values(st).forEach(s=>s.style.opacity=0)}};
  el.addEventListener('pointerup',birak);el.addEventListener('pointercancel',birak);
  aktif={el,id,geriAl:()=>{el.style.transition='transform .3s cubic-bezier(.2,.8,.2,1)';dx=dy=0;goster();Object.values(st).forEach(s=>s.style.opacity=0)}};

    let rot=0;if(ar<0.75){const mag=9+((i*0.7548)%1)*11,side=Math.abs(xv)>Math.abs(yv)?Math.sign(xv):(((i*0.31)%1)<0.5?-1:1);rot=-side*mag}else rot=(((i*0.5698)%1)-0.5)*4;

    if(hareket<10&&Math.hypot(e.clientX-px0,e.clientY-py0)<10&&performance.now()-t0<500){const r=wrap.getBoundingClientRect();const it=pick(e.clientX-r.left,e.clientY-r.top);if(it)sec(it)}});
  function pickIs(it,x,y){const d=ALPHA[it.u[0]];if(!d||it.op<0.05)return false;const dx=x-it.sx,dy=y-it.sy,c=Math.cos(it.rot),s=Math.sin(it.rot);
    const u=Math.floor(((dx*c+dy*s)/it.sw+0.5)*48),v=Math.floor(((-dx*s+dy*c)/it.sh+0.5)*48);if(u<0||u>47||v<0||v>47)return false;return d[(v*48+u)*4+3]>40}

})();
