<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Halalar Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--ink:#f2efe9;--muted:#8a867f;--line:#25252a;--card:#131316;
  --bekle:#ffd21f;--kabul:#7fd69a;--ret:#ff5a4f;--karsi:#8b9bff;--satildi:#cfcac1}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px Barlow,system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;font-size:24px;letter-spacing:-.02em}
h1 small{font-family:Barlow;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.filtre{display:flex;gap:6px;flex-wrap:wrap}
.filtre button,.btn{background:#18181c;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:7px 12px;font:500 12px Barlow;cursor:pointer}
.filtre button.on{background:var(--ink);color:#111}
main{max-width:900px;margin:0 auto;padding:16px}
.giris{max-width:420px;margin:12vh auto;text-align:center;display:grid;gap:14px;padding:0 16px}
.giris p{color:var(--muted);line-height:1.5}
.giris .btn{padding:13px 22px;font-size:14px;justify-self:center}
.talep{display:grid;grid-template-columns:84px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--bekle));border-radius:3px;padding:14px;margin-bottom:12px}
.talep img{width:84px;height:84px;object-fit:contain;background:#1b1b20;border-radius:3px;padding:6px}
.ust{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ust h3{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;font-size:19px}
.rozet{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.satir{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;color:#c9c5bd;font-variant-numeric:tabular-nums}
.satir b{color:var(--ink);font-weight:600}
.kisi{margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kisi a{color:var(--ink)}
.yanit{margin-top:6px;color:var(--karsi);font-size:13px}
.aks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.aks .k{border-color:var(--kabul);color:var(--kabul)}.aks .r{border-color:var(--ret);color:var(--ret)}.aks .s{border-color:var(--satildi);color:var(--satildi)}
.aks input{width:110px;background:#0d0d10;border:1px solid var(--line);border-radius:3px;color:var(--ink);padding:7px 12px;font:500 12px Barlow}
.bos{color:var(--muted);text-align:center;padding:60px 0}
.zaman{color:var(--muted);font-size:12px}
@media (max-width:520px){.talep{grid-template-columns:60px 1fr}.talep img{width:60px;height:60px}}

/* Hit Pazarı logosu: kırmızı çift eğik çizgi + HİT PAZARI (her sayfanın sol üstünde) */
html{font-synthesis:none}
.hpi-sol{display:flex;align-items:center;gap:12px;min-width:0}
.hp-logo{display:inline-flex;align-items:center;gap:.36em;flex:none;text-decoration:none;pointer-events:auto;color:#f2efe9;font:400 22px/1 Anton,"Arial Narrow",Impact,sans-serif;letter-spacing:.005em;white-space:nowrap;text-shadow:none}
.hp-logo .hp-c{color:#e8201c;font-size:1.1em;letter-spacing:-.04em;transform:skewX(-14deg)}
/* vintage dili */
body{font-size:15px}
h1{font-size:26px;line-height:1.1;letter-spacing:.01em}
h1 small{font:700 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.22em}
.giris h1{font-size:44px;color:#e8201c}
.filtre button,.btn{font:700 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;border-color:#3a3a42}
.giris .btn{background:#1b2fa0;border-color:#1b2fa0;color:#fff;font:400 18px/1 Anton,sans-serif;letter-spacing:.05em;padding:15px 26px 14px}
.ust h3{font-size:21px;line-height:1.15}
.rozet{font:700 12px/1 "Barlow Condensed",sans-serif}
.aks input{font:600 13px Barlow,sans-serif}
@media(max-width:520px){header .hp-logo{font-size:19px}h1{font-size:21px}h1 small{display:none}}
.d2r{width:84px;height:84px;flex:none;display:grid;place-items:center;text-align:center;font:400 13px/1.1 Anton,sans-serif;color:#e8201c;border:1px solid #3a3a42;aspect-ratio:1}
</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%278%27 fill=%27%230b0b0d%27/%3E%3Cpath d=%27M12 50 22 14h9L21 50zM30 50 40 14h9L39 50z%27 fill=%27%23e8201c%27/%3E%3C/svg%3E">
<script>/* yerel deneme (bilgisayar/ev ağı): canlı site adreslerini yerel kopyaya çevir; canlıda hiçbir şey yapmaz */(()=>{const y={'8766':['8766','8769'],'8769':['8766','8769'],'8770':['8770','8771'],'8771':['8770','8771']}[location.port];if(!y)return;const o=location.protocol+'//'+location.hostname+':';const f=h=>String(h).replace('https://tolgaarpa.github.io/hitpazari/',o+y[0]+'/').replace('https://tolgaarpa.github.io/halalar-app/',o+y[1]+'/');window.yerelCevir=f;const d=()=>document.querySelectorAll('a[href^="https://tolgaarpa.github.io/"]').forEach(a=>a.setAttribute('href',f(a.getAttribute('href'))));new MutationObserver(d).observe(document.documentElement,{subtree:true,childList:true});addEventListener('DOMContentLoaded',d)})()</script>
</head>
<body>
<header><div class="hpi-sol"><a class="hp-logo" href="hit.html" aria-label="Hit Pazarı"><span class="hp-c" aria-hidden="true">//</span><span class="hp-a">HİT PAZARI</span></a><h1>Halalar <small>Dükkân paneli</small></h1></div>
  <div class="filtre" id="filtre" hidden>
    <button data-f="Beklemede" class="on">Bekleyen</button><button data-f="hepsi">Tümü</button><button id="cikis">Çıkış</button>
  </div></header>
<main id="main"><div class="giris" id="giris">
  <h1>Dükkân paneli</h1>
  <p>Uygulamadan gelen teklifleri ve satın alma taleplerini burada görürsün. Yalnız yetkili Google hesabı girebilir.</p>
  <button class="btn" id="gir">Google ile giriş yap</button>
  <p id="ghata" style="color:var(--ret)"></p>
</div><div id="liste"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-ayar.js"></script>
<script src="urunler.js"></script>
<script src="fiyatlar.js"></script>
<script>
firebase.initializeApp(FIREBASE_AYAR);
const auth=firebase.auth(), db=firebase.firestore();
const TL=n=>(n||0).toLocaleString('tr-TR')+' ₺';
const RENK={'Beklemede':'var(--bekle)','Kabul edildi':'var(--kabul)','Reddedildi':'var(--ret)','Karşı teklif':'var(--karsi)','Satıldı':'var(--satildi)'};
let filtre='Beklemede', veri=[], dinle=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('gir').onclick=()=>{if(/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)|GSA\//.test(navigator.userAgent)){document.getElementById('ghata').textContent='Uygulama içi tarayıcıda Google girişi çalışmaz; Safari/Chrome ile aç.';return}auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{if(e.code!=='auth/popup-closed-by-user')document.getElementById('ghata').textContent='Giriş olmadı ('+(e.code||e.message)+')'})};
document.getElementById('cikis').onclick=()=>auth.signOut();
document.querySelectorAll('#filtre [data-f]').forEach(b=>b.onclick=()=>{filtre=b.dataset.f;document.querySelectorAll('#filtre [data-f]').forEach(x=>x.classList.toggle('on',x===b));ciz()});
auth.onAuthStateChanged(u=>{
  document.getElementById('giris').hidden=!!u; document.getElementById('filtre').hidden=!u;
  if(dinle){dinle();dinle=null} veri=[]; ciz();
  if(!u)return;
  dinle=db.collection('talepler').orderBy('zaman','desc').onSnapshot(q=>{veri=q.docs.map(d=>({id:d.id,...d.data()}));ciz()},
    e=>{document.getElementById('liste').innerHTML=`<div class="bos">Bu hesabın yetkisi yok (${esc(u.email)}). Yetkili hesapla gir.</div>`});
});
function ciz(){
  const el=document.getElementById('liste'); if(!auth.currentUser){el.innerHTML='';return}
  const l=veri.filter(t=>filtre==='hepsi'||t.durum===filtre);
  if(!l.length){el.innerHTML=`<div class="bos">${filtre==='Beklemede'?'Bekleyen talep yok.':'Henüz talep yok.'}</div>`;return}
  el.innerHTML=l.map(t=>{const liste=FIYAT[t.urun]; const z=t.zaman&&t.zaman.toDate?t.zaman.toDate().toLocaleString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    return `<div class="talep" style="--c:${RENK[t.durum]||'var(--muted)'}">${String(t.urun).startsWith('d2:')?'<div class="d2r">YENİ<br>DÜKKÂN</div>':`<img src="img/${esc(t.urun)}.webp" alt="">`}
    <div><div class="ust"><h3>${esc(t.urunAd)}</h3><span class="rozet">${t.satici==='dukkan2'?'DSG · ':''}${t.tur==='teklif'?'Teklif':'Satın alma'} · ${esc(t.durum)}</span></div>
    <div class="satir"><span>${t.tur==='teklif'?'Teklif':'Tutar'}: <b>${TL(t.tutar)}</b></span>${liste?`<span>Liste: ${TL(liste)} (örnek)</span>`:''}<span class="zaman">${z}</span></div>
    <div class="kisi"><span>${esc(t.ad)}</span><a href="tel:${esc(t.tel)}">${esc(t.tel)}</a><button class="btn" data-kopya="${esc(t.tel)}">Numarayı kopyala</button></div>
    ${t.yanit?`<div class="yanit">${esc(t.yanit)}</div>`:''}
    <div class="aks" data-id="${t.id}">
      <button class="btn k" data-d="Kabul edildi">Kabul</button><button class="btn r" data-d="Reddedildi">Ret</button>
      <input inputmode="numeric" placeholder="Karşı teklif ₺"><button class="btn" data-karsi>Karşı teklif ver</button>
      <button class="btn s" data-d="Satıldı">Satıldı</button><button class="btn" data-sil>Sil</button></div></div></div>`}).join('');
  el.querySelectorAll('.aks').forEach(a=>{const ref=db.collection('talepler').doc(a.dataset.id),dur=db.collection('durumlar').doc(a.dataset.id);
    const yaz=v=>ref.update(v).then(()=>dur.set({durum:v.durum,yanit:v.yanit}).catch(e=>console.warn('durum kaydı yazılamadı (kurallar yüklenince düzelir)',e)));
    a.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>yaz({durum:b.dataset.d,yanit:b.dataset.d==='Kabul edildi'?'Dükkân kabul etti, seni arayacak.':b.dataset.d==='Reddedildi'?'Dükkân bu teklifi kabul etmedi.':'Ürün satıldı.'}));
    a.querySelector('[data-karsi]').onclick=()=>{const v=parseInt(a.querySelector('input').value.replace(/\D/g,''))||0;if(v<=0)return;yaz({durum:'Karşı teklif',yanit:'Dükkânın karşı teklifi: '+TL(v)})};
    const sil=a.querySelector('[data-sil]');sil.onclick=()=>{if(sil.dataset.emin){ref.delete().then(()=>dur.delete().catch(()=>{}))}else{sil.dataset.emin=1;sil.textContent='Emin misin? Tekrar bas'}}});
  el.querySelectorAll('[data-kopya]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.kopya).then(()=>b.textContent='Kopyalandı').catch(()=>{}));
}
</script>
</body>
</html>
